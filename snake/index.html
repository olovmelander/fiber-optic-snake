<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fiber Optic Snake</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'VT323', monospace;
            touch-action: none; /* Prevents scrolling on touch devices */
        }
        .touch-control-grid {
            grid-template-areas:
                ". up ."
                "left . right"
                ". down .";
        }
        #up-btn { grid-area: up; }
        #left-btn { grid-area: left; }
        #right-btn { grid-area: right; }
        #down-btn { grid-area: down; }

        .led-glow {
            box-shadow: 0 0 2px #fff, 0 0 5px #fff, 0 0 8px #0fa, 0 0 12px #0fa, 0 0 16px #0fa, 0 0 20px #0fa;
        }

        canvas {
            background-color: #0D1117;
            border: 2px solid #30363d;
            border-radius: 8px;
            box-shadow: 0 0 15px rgba(0, 255, 170, 0.3);
        }
    </style>
</head>
<body class="bg-gray-900 text-gray-200 flex flex-col items-center justify-center min-h-screen p-4">

    <div class="w-full max-w-md mx-auto">
        <h1 class="text-4xl md:text-5xl text-center mb-2 text-cyan-300" style="text-shadow: 0 0 5px #00ffff;">Fiber Optic Snake</h1>
        <div class="flex justify-between items-center mb-4 bg-gray-800 p-3 rounded-lg border border-gray-700">
            <div class="text-2xl">Connected: <span id="score" class="text-green-400 font-bold">0</span></div>
            <div class="flex items-center space-x-2">
                 <span class="text-xl">Status:</span>
                 <div id="status-led" class="w-4 h-4 rounded-full bg-green-500 led-glow transition-all duration-300"></div>
            </div>
        </div>

        <div class="relative">
            <canvas id="gameCanvas"></canvas>
            <div id="roundStartMessage" class="absolute inset-0 bg-black bg-opacity-70 flex-col items-center justify-center text-center p-4 rounded-lg hidden">
                <h2 class="text-3xl text-cyan-400">Time to connect some homes!</h2>
            </div>
            <div id="gameOverScreen" class="absolute inset-0 bg-black bg-opacity-70 flex-col items-center justify-center text-center p-4 rounded-lg hidden">
                <h2 class="text-5xl font-bold text-red-500 mb-2">Connection Lost</h2>
                <p class="text-2xl mb-4">Homes Connected: <span id="finalScore" class="text-yellow-400">0</span></p>
                <button id="restartButton" class="bg-cyan-500 hover:bg-cyan-400 text-gray-900 font-bold py-3 px-6 rounded-lg text-2xl shadow-lg transition transform hover:scale-105">
                    Reconnect
                </button>
            </div>
             <div id="startScreen" class="absolute inset-0 bg-black bg-opacity-70 flex flex-col items-center justify-center text-center p-4 rounded-lg">
                <h2 class="text-3xl text-green-400 mb-4">Ready to connect some homes?</h2>
                <p class="text-xl mb-6">Use Arrow Keys or Swipe to move.</p>
                <button id="startButton" class="bg-green-500 hover:bg-green-400 text-gray-900 font-bold py-3 px-6 rounded-lg text-2xl shadow-lg transition transform hover:scale-105">
                    Initialize
                </button>
            </div>
        </div>
        
        <!-- Touch Controls for Mobile -->
        <div class="mt-4 grid touch-control-grid gap-2 w-48 h-48 mx-auto md:hidden">
             <button id="up-btn" class="bg-gray-700 rounded-lg text-2xl active:bg-gray-600">▲</button>
             <button id="left-btn" class="bg-gray-700 rounded-lg text-2xl active:bg-gray-600">◄</button>
             <button id="right-btn" class="bg-gray-700 rounded-lg text-2xl active:bg-gray-600">►</button>
             <button id="down-btn" class="bg-gray-700 rounded-lg text-2xl active:bg-gray-600">▼</button>
        </div>

    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreEl = document.getElementById('score');
        const statusLed = document.getElementById('status-led');
        const gameOverScreen = document.getElementById('gameOverScreen');
        const startScreen = document.getElementById('startScreen');
        const finalScoreEl = document.getElementById('finalScore');
        const restartButton = document.getElementById('restartButton');
        const startButton = document.getElementById('startButton');
        const roundStartMessage = document.getElementById('roundStartMessage');

        // Game settings
        const gridSize = 20;
        let tileCountX, tileCountY;
        
        // Game state
        let snake, food, direction, score, isGameOver, gameSpeed, gameLoopTimeout;
        
        // Touch controls
        let touchStartX = 0;
        let touchStartY = 0;
        let touchEndX = 0;
        let touchEndY = 0;


        function setupCanvas() {
            const container = canvas.parentElement;
            const size = Math.min(container.clientWidth, 500); // Max width 500px
            canvas.width = size - (size % gridSize);
            canvas.height = size - (size % gridSize);
            tileCountX = canvas.width / gridSize;
            tileCountY = canvas.height / gridSize;
        }

        function initializeGame() {
            isGameOver = false;
            gameSpeed = 120;
            score = 0;
            scoreEl.textContent = score;

            // Place snake in the middle
            const startX = Math.floor(tileCountX / 2);
            const startY = Math.floor(tileCountY / 2);
            snake = [{ x: startX, y: startY }];
            direction = { x: 0, y: 0 };

            placeFood();

            gameOverScreen.classList.add('hidden');
            gameOverScreen.classList.remove('flex');
            startScreen.classList.add('hidden');
            startScreen.classList.remove('flex');
            
            statusLed.classList.remove('bg-red-500');
            statusLed.classList.add('bg-green-500');
            statusLed.style.boxShadow = '0 0 2px #fff, 0 0 5px #fff, 0 0 8px #0fa, 0 0 12px #0fa, 0 0 16px #0fa, 0 0 20px #0fa';

            clearTimeout(gameLoopTimeout);
            
            roundStartMessage.classList.remove('hidden');
            roundStartMessage.classList.add('flex');

            draw(); // Draw initial state so canvas isn't blank

            setTimeout(() => {
                roundStartMessage.classList.add('hidden');
                roundStartMessage.classList.remove('flex');
                gameLoop();
            }, 1500); // 1.5 second delay
        }

        function gameLoop() {
            if (isGameOver) return;
            
            update();
            draw();

            gameLoopTimeout = setTimeout(gameLoop, gameSpeed);
        }

        function update() {
            // Move the snake
            const head = { x: snake[0].x + direction.x, y: snake[0].y + direction.y };

            // Wall collision check
            if (head.x < 0 || head.x >= tileCountX || head.y < 0 || head.y >= tileCountY) {
                endGame();
                return;
            }
            
            // Self collision check
            for (let i = 1; i < snake.length; i++) {
                if (head.x === snake[i].x && head.y === snake[i].y) {
                    endGame();
                    return;
                }
            }

            snake.unshift(head);

            // Food collision check
            if (head.x === food.x && head.y === food.y) {
                score++;
                scoreEl.textContent = score;
                placeFood();
                // Increase speed slightly
                if (gameSpeed > 50) {
                    gameSpeed -= 2;
                }
            } else {
                // Only pop if we didn't eat food
                snake.pop();
            }
        }

        function draw() {
            // Clear canvas
            ctx.fillStyle = '#0D1117';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw fiber-optic cable
            snake.forEach((segment, index) => {
                // Glow effect
                ctx.shadowColor = 'rgba(0, 255, 255, 0.7)';
                ctx.shadowBlur = 15;

                // Outer part of the cable
                ctx.fillStyle = 'rgba(0, 180, 180, 0.8)';
                ctx.fillRect(segment.x * gridSize, segment.y * gridSize, gridSize, gridSize);
                
                // Inner core
                ctx.shadowBlur = 5;
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(
                    segment.x * gridSize + gridSize / 4, 
                    segment.y * gridSize + gridSize / 4, 
                    gridSize / 2, 
                    gridSize / 2
                );
            });

            // Draw food (SDU Household)
            ctx.shadowColor = 'rgba(100, 255, 100, 0.8)';
            ctx.shadowBlur = 15;
            ctx.fillStyle = '#adff2f'; // Lime green for the house

            const foodX = food.x * gridSize;
            const foodY = food.y * gridSize;
            
            const houseBodyY = foodY + gridSize * 0.5;
            const houseBodyHeight = gridSize * 0.5;
            
            // House Body
            ctx.fillRect(foodX + gridSize * 0.2, houseBodyY, gridSize * 0.6, houseBodyHeight);
            
            // Roof
            ctx.beginPath();
            ctx.moveTo(foodX, houseBodyY);
            ctx.lineTo(foodX + gridSize / 2, foodY + gridSize * 0.1);
            ctx.lineTo(foodX + gridSize, houseBodyY);
            ctx.closePath();
            ctx.fill();
            
            ctx.shadowBlur = 0; // Reset shadow for performance
        }

        function placeFood() {
            let newFoodPosition;
            do {
                newFoodPosition = {
                    x: Math.floor(Math.random() * tileCountX),
                    y: Math.floor(Math.random() * tileCountY)
                };
            } while (isFoodOnSnake(newFoodPosition)); // Ensure food doesn't spawn on the snake
            food = newFoodPosition;
        }
        
        function isFoodOnSnake(position) {
            return snake.some(segment => segment.x === position.x && segment.y === position.y);
        }

        function endGame() {
            isGameOver = true;
            finalScoreEl.textContent = score;
            gameOverScreen.classList.remove('hidden');
            gameOverScreen.classList.add('flex');
            
            statusLed.classList.add('bg-red-500');
            statusLed.classList.remove('bg-green-500');
            statusLed.style.boxShadow = '0 0 2px #fff, 0 0 5px #fff, 0 0 8px #f00, 0 0 12px #f00, 0 0 16px #f00, 0 0 20px #f00';

            clearTimeout(gameLoopTimeout);
        }

        function handleKeyPress(e) {
            // Prevent changing direction if no direction is set yet (game start)
            if(direction.x === 0 && direction.y === 0 && e.key.includes('Arrow')) {
                 initializeGame();
            }

            const key = e.key;
            if (key === 'ArrowUp' && direction.y === 0) {
                direction = { x: 0, y: -1 };
            } else if (key === 'ArrowDown' && direction.y === 0) {
                direction = { x: 0, y: 1 };
            } else if (key === 'ArrowLeft' && direction.x === 0) {
                direction = { x: -1, y: 0 };
            } else if (key === 'ArrowRight' && direction.x === 0) {
                direction = { x: 1, y: 0 };
            }
        }
        
        // Touch Controls Logic
        function handleTouchStart(e) {
            touchStartX = e.changedTouches[0].screenX;
            touchStartY = e.changedTouches[0].screenY;
        }

        function handleTouchEnd(e) {
            touchEndX = e.changedTouches[0].screenX;
            touchEndY = e.changedTouches[0].screenY;
            handleSwipe();
        }
        
        function handleSwipe() {
             if (isGameOver) return;
             if(direction.x === 0 && direction.y === 0) {
                 initializeGame();
            }

            const dx = touchEndX - touchStartX;
            const dy = touchEndY - touchStartY;
            const absDx = Math.abs(dx);
            const absDy = Math.abs(dy);

            if (absDx > absDy) { // Horizontal swipe
                if (dx > 0 && direction.x === 0) { // Right
                    direction = { x: 1, y: 0 };
                } else if (dx < 0 && direction.x === 0) { // Left
                    direction = { x: -1, y: 0 };
                }
            } else { // Vertical swipe
                if (dy > 0 && direction.y === 0) { // Down
                    direction = { x: 0, y: 1 };
                } else if (dy < 0 && direction.y === 0) { // Up
                    direction = { x: 0, y: -1 };
                }
            }
        }

        // Event Listeners
        document.addEventListener('keydown', handleKeyPress);
        restartButton.addEventListener('click', initializeGame);
        startButton.addEventListener('click', initializeGame);
        
        // Touch Listeners
        canvas.addEventListener('touchstart', handleTouchStart, false);
        canvas.addEventListener('touchend', handleTouchEnd, false);
        
        // Touch button listeners
        document.getElementById('up-btn').addEventListener('click', () => { if (direction.y === 0) direction = {x: 0, y: -1}; });
        document.getElementById('down-btn').addEventListener('click', () => { if (direction.y === 0) direction = {x: 0, y: 1}; });
        document.getElementById('left-btn').addEventListener('click', () => { if (direction.x === 0) direction = {x: -1, y: 0}; });
        document.getElementById('right-btn').addEventListener('click', () => { if (direction.x === 0) direction = {x: 1, y: 0}; });


        window.addEventListener('resize', setupCanvas);
        
        // Initial setup
        setupCanvas();
    </script>

</body>
</html>
